<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <title>Terms of Service | Angel's Home Improvements</title>
  <link rel="canonical" href="https://angelshomeimprovementsinc.com/terms-of-service">
  <meta name="description" content="The terms that govern your use of the Angel's Home Improvements Inc. website and services.">
  <link rel="icon" type="image/png" href="site/favicon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Angel's Home Improvements">
  <meta property="og:title" content="Terms of Service | Angel's Home Improvements">
  <meta property="og:description" content="The terms that govern your use of the Angel's Home Improvements Inc. website and services.">
  <meta property="og:url" content="https://angelshomeimprovementsinc.com/terms-of-service">
  <meta property="og:image" content="https://angelshomeimprovementsinc.com/site/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Walnut slat accent wall with integrated lighting, built by Angel's Home Improvements">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Terms of Service | Angel's Home Improvements">
  <meta name="twitter:description" content="The terms that govern your use of the Angel's Home Improvements Inc. website and services.">
  <meta name="twitter:image" content="https://angelshomeimprovementsinc.com/site/og-image.jpg">
  <link rel="apple-touch-icon" href="site/apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site/style.css">
  <link rel="stylesheet" href="site/upgrade.css?v=5">
  <link rel="stylesheet" href="site/legal.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    body { background: #fff; }
  </style>
</helmet>

<dc-import name="Site Header" variant="solid" hint-size="100%,140px"></dc-import>

<section class="legal-hero">
  <h1>Terms of Service</h1>
  <p>Last updated May 01, 2026</p>
</section>

<div class="legal-wrap">
  <div class="legal-doc" id="legalDoc">
    <p style="font-family: 'Sora', sans-serif; color: #5A72A0">Loading…</p>
  </div>
</div>

<dc-import name="Site Footer" hint-size="100%,420px"></dc-import>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    // The Termly document lives in site/termsofservice.html so this page stays small.
    // Header and footer come from the shared components, so they can never drift.
    fetch('site/termsofservice.html')
      .then(r => r.text())
      .then(html => {
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const body = doc.querySelector('.legal-doc');
        const host = document.getElementById('legalDoc');
        if (!body || !host) return;
        host.innerHTML = '';
        Array.from(body.childNodes).forEach(n => {
          if (n.nodeName === 'SCRIPT') return;
          host.appendChild(document.importNode(n, true));
        });
      })
      .catch(() => {
        const host = document.getElementById('legalDoc');
        if (host) host.innerHTML = '<p style="font-family: Sora, sans-serif">The terms could not be loaded. <a href="site/termsofservice.html">Open them directly</a>.</p>';
      });
  }
}

</script>
</body>
</html>
