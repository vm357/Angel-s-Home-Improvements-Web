[build]
  publish = "."

# Clean URLs — the meta tags all point at /project-gallery, not /project-gallery.dc.html
[[redirects]]
  from = "/"
  to = "/index.dc.html"
  status = 200

[[redirects]]
  from = "/our-work"
  to = "/our-work.dc.html"
  status = 200

[[redirects]]
  from = "/interior-services"
  to = "/interior-services.dc.html"
  status = 200

[[redirects]]
  from = "/exterior-services"
  to = "/exterior-services.dc.html"
  status = 200

[[redirects]]
  from = "/project-gallery"
  to = "/project-gallery.dc.html"
  status = 200

[[redirects]]
  from = "/reviews"
  to = "/reviews.dc.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.dc.html"
  status = 200

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy-policy.dc.html"
  status = 200

[[redirects]]
  from = "/terms-of-service"
  to = "/terms-of-service.dc.html"
  status = 200

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# The CMS rewrites this file; never let a stale copy be served
[[headers]]
  for = "/site/gallery.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
