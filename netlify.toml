[build]
  publish = "."
  functions = "netlify/functions"

# The public review form posts here; the function commits the review into
# site/reviews.json marked unpublished, for approval in /admin.
[[redirects]]
  from = "/api/submit-review"
  to = "/.netlify/functions/submit-review"
  status = 200

# Clean URLs — the meta tags all point at /project-gallery, not /project-gallery.dc.html
[[redirects]]
  from = "/"
  to = "/index.dc.html"
  status = 200

[[redirects]]
  from = "/our-work"
  to = "/our-work.dc.html"
  status = 200

[[redirects]]
  from = "/interior-services"
  to = "/interior-services.dc.html"
  status = 200

[[redirects]]
  from = "/exterior-services"
  to = "/exterior-services.dc.html"
  status = 200

[[redirects]]
  from = "/project-gallery"
  to = "/project-gallery.dc.html"
  status = 200

[[redirects]]
  from = "/reviews"
  to = "/reviews.dc.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.dc.html"
  status = 200

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy-policy.dc.html"
  status = 200

[[redirects]]
  from = "/terms-of-service"
  to = "/terms-of-service.dc.html"
  status = 200

# Canonical: the .dc.html file itself redirects to the clean URL so Google
# never sees two addresses for one page.
[[redirects]]
  from = "/index.dc.html"
  to = "/"
  status = 301
[[redirects]]
  from = "/our-work.dc.html"
  to = "/our-work"
  status = 301
[[redirects]]
  from = "/interior-services.dc.html"
  to = "/interior-services"
  status = 301
[[redirects]]
  from = "/exterior-services.dc.html"
  to = "/exterior-services"
  status = 301
[[redirects]]
  from = "/project-gallery.dc.html"
  to = "/project-gallery"
  status = 301
[[redirects]]
  from = "/reviews.dc.html"
  to = "/reviews"
  status = 301
[[redirects]]
  from = "/contact.dc.html"
  to = "/contact"
  status = 301
[[redirects]]
  from = "/privacy-policy.dc.html"
  to = "/privacy-policy"
  status = 301
[[redirects]]
  from = "/terms-of-service.dc.html"
  to = "/terms-of-service"
  status = 301

# Header rules are matched in order and the FIRST match wins for a given
# header, so everything the CMS or I rewrite in place must be listed BEFORE
# the catch-all below, or it inherits the one-year cache and goes stale.
[[headers]]
  for = "/site/reviews.json"
  [headers.values]
    Cache-Control = "no-store, max-age=0, must-revalidate"

[[headers]]
  for = "/site/gallery.json"
  [headers.values]
    Cache-Control = "no-store, max-age=0, must-revalidate"

[[headers]]
  for = "/site/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/site/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Photos and videos are versioned by filename — cache them hard.
[[headers]]
  for = "/site/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/site/gallery/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

