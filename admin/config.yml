backend:
  name: git-gateway
  branch: main

media_folder: "site/uploads"
public_folder: "site/uploads"

publish_mode: simple

collections:
  - name: "gallery"
    label: "Project Gallery"
    files:
      - name: "photos"
        label: "Gallery Photos"
        file: "site/gallery.json"
        description: "Add a finished-project photo. It goes live about a minute after you publish."
        fields:
          - label: "Photos"
            name: "photos"
            widget: "list"
            label_singular: "Photo"
            summary: "{{fields.caption}} — {{fields.category}}"
            fields:
              - { label: "Slot ID", name: "id", widget: "hidden", required: false }
              - { label: "Photo", name: "image", widget: "image", required: false }
              - { label: "Caption", name: "caption", widget: "string", hint: "Short, e.g. 'Full Kitchen Redesign'" }
              - label: "Category"
                name: "category"
                widget: "select"
                options: ["Kitchens", "Bathrooms", "Interiors", "Outdoor"]

  - name: "reviews"
    label: "Customer Reviews"
    files:
      - name: "list"
        label: "Published Reviews"
        file: "site/reviews.json"
        description: "New reviews arrive here automatically with Published switched off. Read one, tick Published to put it on the site, or use the trash icon to deny it. Publish saves your decision."
        fields:
          - label: "Reviews"
            name: "reviews"
            widget: "list"
            label_singular: "Review"
            summary: "{{fields.name}} — {{fields.rating}}★ {{fields.published}}"
            fields:
              - { label: "Published", name: "published", widget: "boolean", default: false, hint: "Off means nobody sees it. Tick it to put this review on the site." }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Town", name: "town", widget: "string", required: false }
              - { label: "Rating", name: "rating", widget: "number", value_type: "int", min: 1, max: 5, default: 5 }
              - { label: "Review", name: "text", widget: "text" }
              - { label: "Photo", name: "image", widget: "image", required: false }
              - { label: "More photos", name: "extraImages", widget: "list", required: false, field: { label: "Photo", name: "image", widget: "image" } }
              - { label: "Submitted", name: "submitted", widget: "datetime", required: false, read_only: true }
