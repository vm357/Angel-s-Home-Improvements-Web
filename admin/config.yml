backend:
  name: git-gateway
  branch: main

media_folder: "site/uploads"
public_folder: "site/uploads"

publish_mode: simple

collections:
  - name: "gallery"
    label: "Project Gallery"
    files:
      - name: "photos"
        label: "Gallery Photos"
        file: "site/gallery.json"
        description: "Add a finished-project photo. It goes live about a minute after you publish."
        fields:
          - label: "Photos"
            name: "photos"
            widget: "list"
            label_singular: "Photo"
            summary: "{{fields.caption}} — {{fields.category}}"
            fields:
              - { label: "Slot ID", name: "id", widget: "hidden", required: false }
              - { label: "Photo", name: "image", widget: "image", required: false }
              - { label: "Caption", name: "caption", widget: "string", hint: "Short, e.g. 'Full Kitchen Redesign'" }
              - label: "Category"
                name: "category"
                widget: "select"
                options: ["Kitchens", "Bathrooms", "Interiors", "Outdoor"]

  - name: "reviews"
    label: "Customer Reviews"
    files:
      - name: "list"
        label: "Published Reviews"
        file: "site/reviews.json"
        description: "Reviews arrive by email. Paste one in here to publish it, or untick Published to hide it."
        fields:
          - label: "Reviews"
            name: "reviews"
            widget: "list"
            label_singular: "Review"
            summary: "{{fields.name}} — {{fields.rating}}★"
            fields:
              - { label: "Published", name: "published", widget: "boolean", default: true }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Town", name: "town", widget: "string", required: false }
              - { label: "Rating", name: "rating", widget: "number", value_type: "int", min: 1, max: 5, default: 5 }
              - { label: "Review", name: "text", widget: "text" }
              - { label: "Photo", name: "image", widget: "image", required: false }
